    strengths:
    - 'Span termination is exact-once by construction: `publish_completed` asserts
      `published == filled / granule` and `route_span_failure` asserts `span.published
      + failed == span.count` (src/pool/read_spans.rs), so a destination cannot be
      published twice or dropped silently across continuation resumes.'
    - 'Original-slot continuation keeps ownership coherent across the slab: `finish_attempt`
      (src/driver.rs:1560-1617) returns `OpState::Continuation` with the same OpToken
      on a short read and only surrenders the slot at the terminal outcome via `ReadContinuation::drop`
      -> `release_read_lease` -> bounded `DeferredCompletion`; slab exhaustion cannot
      refuse a retry, and `FrameLease::Pool` vs `Raw` makes the reclaim/terminal split
      unrepresentable in the wrong state.'
    - Every `prefetch_admit_vector` failure arm rolls back completely — route slot,
      miss slots, reserved frames and read credits — so a refusal at any admission
      step leaves the pool in the pre-admission state; the vector-refusal rollback
      test in tests/readahead_coalescing.rs falsifies it directly.
    - "`DirtyFrames` (src/pool/prefetch/notifications.rs) publishes bottom-up with
      Release `fetch_or` on every ancestor and drains top-down with Acquire swaps
      from the root, giving a sound synchronizes-with edge for O(1) idle polls and
      O(k) work per changed run — no capacity scan on an empty poll."
    - Ready-stream membership is kept exactly equal to `window(..).is_some()` by `refresh_ready`
      on every pattern mutation, which is what makes the `unreachable!("ready stream
      has eligible horizon")` unreachable rather than optimistic; round-robin turn
      advance is gated on admitted > 0 or a non-Deferred/Rejected/Obsolete outcome,
      so credit deferral cannot starve a stream.
    - 'The backend honors the deferred READV_FIXED boundary: `push_read_vector` (src/backend/uring.rs)
      issues ordinary `Readv` over `types::Fixed(file.slot())` with no registered
      buffer, and the eager backend''s `attempt_read_vector` breaks on the first short/erroring
      pread so later destinations stay untouched — same observable contract on both
      backends.'
    - 'Geometry degrades to point reads correctly rather than by special-case: `vector_width
      = (VECTOR_BYTES_MAX / granule).clamp(1, 32)` and `automatic_width = 1` unless
      capacity admits two full vectors (src/pool/prefetch/state.rs:285-290), covering
      both the large-granule zero-width trap and the small-capacity compatibility
      requirement.'
    - src/pool/loom_model.rs:29 imports the real `ReadSpan`/`ReadSpans`, so the loom
      interleavings exercise the production route slab instead of a divergent hand
      model; RC5 added span-publication/join/route-reuse and delayed-consumption-across-drain
      cases to it.
    - 'Evidence discipline: results.md retains the failed original 2+30 DRP ordinary-8t
