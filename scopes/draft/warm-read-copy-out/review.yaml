        suggestion: 'In scope.md item 1, bound the prohibition to operations the verb
          adds: the optimistic path introduces no epoch publication, CLOCK reference
          write, allocation, retry loop or new fence beyond the existing seqlock probe,
          whose Acquire fence and bounded spin are inherited from Pool::get. One sentence;
