          sources rather than reusing the pool-only one — sole owner src/pool/read_copy.rs,
          with src/pool/frames.rs permitted only for the raw-address seam definition.
          One rule, one root; the existing sync-alias rule keeps its pool scope and
          its diagnostics owner.
      clarifying_questions:
