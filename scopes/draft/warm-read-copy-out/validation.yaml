needs_decision:
- id: WRC-D1
  status: decided
  decided_at: '2026-09-14'
  owner: Sören
  blocking: false
  requirement: 'Audited all-backend copy and exact-identity proof preserving the requested
    no-pin/no-fence path, or separately approved ownership/storage amendment. Resolve
    file-capability lifetime: mirror-only check versus ResidentFileLease.'
  decision: 'Accept an owned, audited exception in the ARCH-3 style. The optimistic
    copy reads payload with aligned word-width volatile loads, bracketed by Acquire
    loads of the frame state word and the exact-identity cells before and after the
    copy and an Acquire load of the file-generation mirror after it. Every in-process
    writer of frame payload (the mock fill and any test fill) becomes word-atomic
    relaxed stores of the same width, so Miri can check the only race the abstract
    machine can see. Kernel writes (io_uring DMA and the eager syscall) are outside
    the abstract machine and are recorded as such, as for every Rust reader of kernel-written
    memory. Identity cells are atomics. The exception lives in one audited module
    with the stated invariant; loom proves the stamp protocol; Miri proves the in-process
    writer discipline. Mirror-only file liveness is sufficient: nothing outlives the
    call, so no ResidentFileLease is required. Stamp width and wrap policy unchanged.

'
