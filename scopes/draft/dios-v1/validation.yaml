clarification_log:
  - id: C001
    area: scope
    question: "Pool as backend behind seam with mmap default, or pool becomes default?"
    answer: "Pool becomes default (Linux); later amended by user: mmap stays default on macOS (AD-2)"
    impact_uncertainty: high
    integration: scope.md AD-2, DIO-R3
  - id: C002
    area: behavior
    question: "Write path in scope?"
    answer: "Full — reads, writes, journal through the crate"
    impact_uncertainty: high
    integration: scope.md AD-3, DIO-R4
  - id: C003
    area: constraints
    question: "macOS backend: sync-inline vs blocking thread pool?"
    answer: "Blocking thread pool"
    impact_uncertainty: medium
    integration: scope.md Tech Decisions (Darwin backend)
  - id: C004
    area: constraints
    question: "Performance gates?"
    answer: "Strict parity (interpreted as parity-within-95%-CI to stay falsifiable; flagged to user)"
    impact_uncertainty: high
    integration: scope.md DIO-G1
  - id: C005
    area: integration
    question: "Sequencing vs read-perf/read-concurrency worktrees?"
    answer: "Fully sequential — nothing starts until both are done"
    impact_uncertainty: high
    integration: frontmatter blocked_by, dependencies.yaml external
  - id: C006
    area: behavior
    question: "API shape (guided approach selection)?"
    answer: "Completion reactor — no futures, no async runtime deps"
    impact_uncertainty: high
    integration: scope.md AD-1, API Contract
  - id: C007
    area: constraints
    question: "Revisit C003 after AD-2 platform split: thread pool vs eager-inline portable backend?"
    answer: "Eager-inline (TigerBeetle darwin shape): submit enqueues, poll executes syscall on calling thread outside the lock — supersedes C003's thread pool"
    impact_uncertainty: medium
    integration: scope.md AD-7, Tech Decisions, T003; design.md alternatives
  - id: C008
    area: scope
    question: "Is the macOS read path mmap-only, or is the pool a supported fallback?"
    answer: "Both backends work on both platforms behind config; platform split is defaults only (Linux=pool, macOS=mmap). Pool-on-macOS is supported + full-suite tested; advisory pool-vs-mmap measurement in T011 informs any future default flip"
    impact_uncertainty: high
    integration: scope.md AD-2, DIO-R3, T011, Non-Goals

