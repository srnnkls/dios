clarification_sessions:
  - id: S002
    timestamp: 2026-07-07
    source: review_gate_round_1
    reviewers: [claude-opus, claude-sonnet, codex-gpt5.5, gemini-3.5-flash]
    findings_folded:
      - "critical (gemini, opus): blocks > GRANULE unhandled -> AD-5: GRANULE is a hard writer-enforced block-size bound; multi-frame assembly rejected in design.md"
      - "high (codex, gemini): sector-padding format underspecified + old-segment O_DIRECT compat -> AD-5 vNext spec requirements + version-routed mmap backend for pre-vNext, compaction migrates (superseded by S003: backward compat dropped)"
      - "high (codex, gemini): unaligned journal/manifest writes vs O_DIRECT -> AD-3: O_DIRECT segment data plane only; metadata buffered+fsync through reactor"
      - "high (codex, gemini, opus): parity gate ambiguous + measured at wrong layer -> DIO-G1 pinned: block-fetch layer, decoded cache bypassed, one-sided 95% CI upper bound <= 1.00, >= 30 interleaved reps, explicit blocked-flip failure consequence"
      - "high (opus): merge-path self-deadlock -> INV-9 watermark invariant, open-fail below watermark, Busy unreachable within watermark"
      - "high (opus): ring topology unspecified -> AD-4 shared ring + submit mutex, poll-caller epoch advance, per-worker-ring escalation recorded"
      - "high (codex): no pool error channel -> Get::{Hit,Pending,Busy}, ReadyResult::Err with singleflight error fanout"
      - "high (codex): EBR not testably specified -> design.md EBR algorithm section (two-advance reclamation, stalled-reader, shutdown) + loom cases"
      - "high (sonnet): block_storage.rs name collision -> seam renamed BlockSource (sira/src/block_source.rs); existing segment/block_storage.rs noted unchanged"
      - "high (sonnet): DIO-G6 no owning task -> full sweep folded into T014 + AC row added"
      - "high (sonnet): DIO-G2 had no acceptance-criteria row -> AC row added"
      - "medium folds: waiter-interest drop naming (T015/API), T012 deps += T006 and content split format-vs-backend, O_DIRECT-unavailable policy (buffered pool, never silent mmap), granule measurement moved to T006, PageId.granule_idx rename, DIO-G3 tolerance 2.0x p50, phase-vs-batch note, dio-no-sira-dep CI check (T005), INV-7 per-residency CRC semantics note + re-read test, barrier attribution corrected to commit path"
  - id: S003
    timestamp: 2026-07-07
    source: review_gate_round_2
    reviewers: [claude-opus, claude-sonnet, codex-gpt5.5, gemini-3.5-flash]
    findings_folded:
      - "critical (opus DIO2-1): AD-5 granule bound unsatisfiable vs writer.rs:97-99 oversize-own-block semantics -> AD-6 hard value-size cap (ValueTooLarge at write path, INV-10); grounded by gestalt store measurement (max value 758B over 36,423 rows); value-log escalation recorded"
      - "critical (gemini): no write-allocation API -> WriteArena registered staging buffers (DIO-R2b), separate from read pool, outside watermark (also closes opus DIO2-2 frame-accounting ambiguity)"
      - "high (codex): CRC layering contradiction (pool-below-CRC vs CRC-on-completion) -> pool is CRC-agnostic raw-granule cache; per-block verify stays in segment::block_storage above the seam; INV-7 reduced to immutability; per-fetch semantics unchanged"
      - "high (gemini): submit_write FrameIdx-only unusable for metadata -> blocking metadata wrappers write_all_blocking/fsync_blocking (AD-3)"
      - "high (opus DIO2-3): watermark under-bounded by open-time fan-out -> static max merge fan-out f(ln_runs[20]+levels), compaction counted as reader, registration slots capped (INV-9)"
      - "medium folds: EBR publish-before-validate guard-create ordering + loom interleave case (opus DIO2-5), TLS-destructor thread deregistration (gemini), INV-3 never-blocks narrowed to kernel/queue waits (codex), validation.yaml T012->T006 refs (codex/gemini/opus DIO2-4), dependencies.yaml files arrays synced T001/T006/T009/T012/T014/T015 (sonnet R2-01), DIO-G2 AC-row bullet added reconciling blocking_found (sonnet R2-02)"
  - id: S004
    timestamp: 2026-07-07
    source: review_gate_round_3
    reviewers: [claude-opus, claude-sonnet, codex-gpt5.5, gemini-3.5-flash]
    findings_folded:
      - "high (sonnet, opus, codex — same residual): AD-5 heading + Data Model bullet retained version-routing language -> AD-5 retitled, bullet rewritten to open-time rejection; rg sweep confirms no residual outside audit trail"
      - "high (codex): submit_write took read-pool FrameIdx despite separate WriteArena -> typed buffer identity ReadFrameIdx vs WriteSlotIdx; registered sets disjoint by type"
      - "medium folds: register_reader -> Result<ReaderCtx, RegistrationExhausted> typed registration-time error, get() takes &ReaderCtx (gemini); WriteArena::alloc_wait park/wake instead of spin (gemini); macOS F_NOCACHE-write vs mmap-read coherency gotcha — map only after finalize+F_FULLFSYNC+manifest publish (gemini); WriteArena wording registered(Linux)/aligned(darwin) (opus low); ValueTooLarge AC reworded to before-block-formation, grounded at block.rs:40 (opus low); S002 superseded-by-S003 annotation (opus low)"
      - "owner decisions this round: hard value-size cap accepted (breaking OK); backward compatibility dropped entirely — store open trips on non-current format version, old stores rebuild (AD-5 simplified, version routing removed)"

complexity_tracking:
  - violation: "Second read backend + owned residency layer duplicates what the kernel page cache provides"
    justification: "Scheduled misses (nmnm residency contract) and explicit eviction are unobtainable via mmap; platform split confines the duplication to Linux"
    alternative_rejected: "mmap+block-cache endpoint (design.md alternative 1) — page faults unschedulable"

