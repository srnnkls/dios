        - "low (opus): macOS coherency gotcha generalized to mmap-or-pool reads; design_context sync-inline entry annotated as selected via C007/AD-7"
    - id: R2
      date: 2026-07-07
      decisions: [terminology only — Reactor renamed Driver throughout (the API is proactor-shaped by Schmidt taxonomy: submit ops, demultiplex completions; 'reactor' denotes readiness demultiplexing, which the crate does not do)]
      touched: [scope.md, design.md, tasks.yaml, dependencies.yaml — mechanical rename incl. dio/src/driver.rs]
      confirmation: not required (no semantic change; rg-verified zero residuals)
    - id: R3
      date: 2026-07-08
      decisions: [crate extracted up front — `dios` is a standalone crate in its own repository (this one), no longer a sira workspace member; sira consumes it as a dependency; sira-wiring phase (T010-T014) executes in the sira repository (~/projects/sira); scope renamed sira-direct-io -> dios-v1]
      touched: [scope.md intro/Context/Constraints/Tech Decisions/DIO-R1/Dependency Graph/Verification, design.md alternatives/complexity/notes, tasks.yaml T001/T005/T012/T013 + crate paths de-prefixed, dependencies.yaml paths + phase names]
      confirmation: not required (repo split + rename; the T005 dio-no-sira-dep CI assertion becomes structural — separate repository — with no other semantic change to invariants or gates)
    - id: R4
      date: 2026-07-08
      decisions: [two codex findings from the AGENTS.md review (.reviews/agents-md/codex-gpt5.5.yaml) carried into the scope, which owns the content after the AGENTS.md slim-down]
      touched: [scope.md Constraints/AD-7/Tech Decisions/Data Model, design.md INV-4, tasks.yaml T003/T004]
      confirmation: not required (probe refinement + explicit statement of existing intent; no gate numbers changed)
      findings:
        - "medium (codex): per-filesystem O_DIRECT probe under-detects — Linux alignment constraints are file/device-specific -> probe per opened file/device via statx(STATX_DIOALIGN) (kernel >= 6.1; TigerBeetle-style write probe pre-6.1), probed alignment encoded in the open handle's constructor so misalignment is rejected before an op is issued"
        - "high (codex): frames-registered-with-the-ring wording made the eager backend violate the architecture -> stated explicitly: eager uses the same preallocated, non-moving frame slab unregistered; ring registration is uring-only; INV-4 quiesce-before-free holds on both backends"

notes: |
  User decisions deliberately exceed the assistant's recommendations on three
  axes (pool-as-default, full write plane, strict parity); recorded as informed
  choices. Strict parity is encoded as parity-within-95%-CI on the pinned
  1/5-scale bench to remain falsifiable. The scope corrects a copy-semantics
  conflation in sira-read-hotpath/resources/mmap-soundness.md (per-miss copy
  applies to buffered pread only, not O_DIRECT); that doc was not edited.
