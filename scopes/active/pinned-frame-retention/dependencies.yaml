scope: pinned-frame-retention
external_dependencies:
  - scope: dios-r1-r7-read-performance
    task: DRP010
    required_by: T1
    contract: pinned frame-state/reclaim branch for HELD rebase and review
  - scope: arena-modernization
    task: AM4
    required_by: T8b
    provider_gate: pending
    contract: >-
      default-memlock-compatible arena posture (probed/sparse registration
      with unregistered READ/READV fallback) for the exact R8-scale
      shipping arm (owner decision, scope.md revision 11-13); supersedes
      the former dios-unregistered-buffer-backend placeholder; the provider
      scope's own review gate has not yet run — T8a and scope closure do
      not wait on it
  - scope: sira
    task: unscoped
    required_by: none
    contract: >-
      the retained-vs-locator tie gate is discharged by a sira-side
      companion run (locator mmap, BlockVerification mode, and corpus are
      sira artifacts) under the warm-state controls recorded in T1; no
      task in this scope authors or executes that arm
provides:
  - scope: arena-modernization
    task: AM2
    provided_by: T7
    contract: >-
      retention protocol landed and green before arena implementation
      touches src/pool/mod.rs (arena AM1 plan authoring does not wait)
  - scope: sira
    task: DM003-close-coda
    provided_by: T12
    contract: >-
      The accepted amendment revision contains T017 plus T10-T12; Sira adapts
      FileRegistrationError and PoolBuildError::Allocation before advancing its
      pin, then closes DM003 against that one revision.
  - scope: sira
    task: DM005
    provided_by: T10
    contract: peak_guards_per_reader is enforced at commit_pin.
  - scope: sira
    task: DM004-sink + DM005-capacity
    provided_by: T11
    contract: new-artifact creation and configurable registered-file capacity.
  - scope: sira
    task: DM005-mode-observability + DM007 + DM008
    provided_by: T12
    contract: negotiated IoMode readback after the T11 artifact plane lands.
