      - Remove current-slot readiness or the terminal pending hint.
      - Slow the disabled path with an occupied-budget load.
      - Conflate disabled and enabled-idle with a plain boolean.
    reason: Option<bool> represents the three reachable states without an illegal combination and lets one release-ring load feed both enablement and readiness while preserving every mandatory enabled-path Acquire.
  - date: 2026-08-24
    decision: Freeze a2e01f5e710d0718fd3288e51e979fa2e6096c5f as the next clean timing candidate and supersede all v16 timing evidence for closure.
    alternatives:
      - Time the dirty reviewed worktree.
      - Reuse v16 artifacts sealed to dddf9231.
