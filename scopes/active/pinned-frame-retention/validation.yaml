    reason: Corrected RED review, three-role source review, targeted fix rereview, and independent verification passed; optimized Linux codegen proves one inlined selector load, register-only tri-state control, disabled load avoidance, and one shared plain drain, while binding gates must attest the exact committed candidate.
  - date: 2026-08-24
    decision: Use the isolated v17 seal for every remaining T8a lane.
    alternatives:
      - Reuse v16 products, runner, input, or timing samples.
      - Build timing products from the dirty controller checkout.
      - Overwrite an earlier versioned seal.
    reason: The clean baseline and candidate products report runtime-matching source identities 4264896e and a2e01f5e; the v17 bundle SHA-256 is 5164f8b9, runner source digest 05349415, baseline executable 514096bf, candidate executable cffc9afe, runner executable 2b2c993d, and input ce18cc20, with unchanged product and harness lock hashes.
  - date: 2026-08-24
    decision: Accept the v17 nonzero-budget poll lane as final-candidate evidence.
    alternatives:
      - Retain the superseded v16 binding FAIL.
      - Rerun the valid v17 lane under another suffix.
    reason: All 40 rich-row pairs validated against candidate a2e01f5e; budget64/zero geomean 0.9984 and one-sided CI95 upper 1.0071 pass the unchanged 1.0100 gate, with process, paired, and provenance SHA-256 values 5033d4d1, 8eebae89, and 21eeced6.
  - date: 2026-08-24
    decision: Treat the valid v17 transient-guard result as a binding performance RED and invoke only its recorded transient-path escalation lever.
    alternatives:
      - Rerun the valid lane unchanged as noise.
      - Reuse the superseded v16 transient PASS.
      - Relax or round the 1.0100 threshold.
      - Continue other final-candidate lanes before freezing the transient fix.
    reason: All 40 rich-row pairs validated, but candidate/base geomean 1.0113 and one-sided CI95 upper 1.0149 fail the frozen gate; the exact process, paired, and provenance artifacts are sealed by SHA-256 values 407983fb, 1eae193d, and 7689fbde, so profiling must identify removable retention work in begin_pin, guard minting, dereference, or release_guard.
  - date: 2026-08-24
    decision: Return only bytes plus frame in a 24-byte private pin carrier and construct the promotion-capable guard once from caller-owned metadata.
    alternatives:
      - Return only the frame and resolve bytes in each caller.
      - Keep returning the complete 40-byte guard.
      - Force the pin protocol inline at every caller.
      - Pack, split, or allocate promotion metadata out of line.
    reason: The reviewed frame-only experiment removed the large return but grew Pool::get to 0x847, rematerialized PageId, spilled four live values, and resolved frame bytes separately. The final borrowed PageId and ReaderSlot boundary returns only the byte slice and frame, yields Pool::get 0x503 with a 0x48 stack, and removes the full-guard temporary without replacement work; focused, Loom, zero-allocation, full, no-feature, lint, and three-agent targeted reviews pass.
  - date: 2026-08-24
    decision: Keep the reviewed compact carrier unchanged after the required Samply and cargo-flamegraph cost model, then commit and seal it for a fresh transient gate.
    alternatives:
      - Apply another source optimization before profiling established the remaining cost.
      - Optimize the residual GOT-indirect pin_owned call before it causes a gate failure.
      - Rerun the binding v17 products, which do not contain the compact carrier.
      - Relax the frozen 1.0100 threshold.
    reason: The binding regression remains candidate/base geomean 1.0113 and upper 1.0149. Exact assembly attributes it to seven extra instructions and 52 bytes of private carrier traffic per hit, including the mixed-width frame/file reload at 0x8f852. High-rate Samply puts inclusive get samples at 394 baseline, 422 sealed, and 306 compact, and inclusive pin_owned at 227, 266, and 207; the sealed hotspot receives 52 samples while the compact transfer receives 12. Cargo-flamegraph independently identifies the same transfer and gives whole-probe weighted ratios 1.007886 sealed/base and 1.003969 compact/base. The residual global-symbol GOT call is recorded, but both profilers place the complete compact hot chain below the predecessors, so changing it before the frozen gate would be speculative.
