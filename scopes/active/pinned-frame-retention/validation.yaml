ambiguity_scan:
  scope: clear        # pin promotion; boundaries to sira adapter and victim policy stated
  behavior: clear     # promotion ordering, refusal-carries-guard, HELD release resolved
  data_model: clear   # per-frame packed retention word + HELD bit, preallocated
  constraints: clear  # INV-9; memlock fork resolved r11 — kernel-default baseline, raised limit demoted to opt-in knob
  edge_cases: clear   # exhaustion, partial-session rollback, promote/evict race
  integration: clear  # R8 consumer contract plus DRP010 serialization/rebase stated
  terminology: clear  # retain / promote / transient guard / HELD defined in design.md

questions:
  - area: behavior
    question: RetainedFrame cloneable (shared retentions) or one handle per promotion?
    answer: No Clone in v1; N values in one frame take N independent pins.
  - area: affinity
    question: Should RetainedFrame be Send?
    answer: "!Send in v1; release stays on the owning thread and the consumer session is thread-local."
  - area: edge_cases
    question: How is retention capacity bounded?
    answer: PoolBuilder::max_retained_frames, validated against the augmented INV-9 watermark at build.
  - area: benchmark
    question: How can the exact 8,035-page R8 arm run on the registered shipping backend under the host's 8 MiB hard memlock limit?
    answer: >-
      It cannot on the registered backend under defaults. Owner decision
      (revision 11, terminology corrected r13): the baseline operates under
      the stock unprivileged 8 MiB limit (systemd DefaultLimitMEMLOCK; the
      kernel's own 64 KiB default is not a target), so the exact arm runs
      the Unregistered posture from arena-modernization:AM4; raising the
      limit is an opt-in optimization knob only, and a smaller workload
      stays labelled non-equivalent to R8.
  - area: benchmark
    question: What distinguishes a valid warm comparison from mere page-cache residency in the retained-vs-locator arm?
    answer: >-
      Prefaulted locator mapping (MADV_POPULATE_READ), zero timed-region
      minor AND major faults on both arms (RUSAGE_THREAD), an identical
      pinned BlockVerification mode, one identical segment layout across
      arms (a pair on the SAP1 superblock layout is a new baseline, not an
      R8 reproduction), and both sides' recorded page-size state — page-
      cache residency proves neither PTE presence nor TLB state. The
      <= 1.02 threshold is a tie gate with the equal-regime qualifier: a
      sub-1.0 ratio is interpretable only where the arms' page-size states
      differ (the Capacity lever). The arm itself is a sira-side companion
      run recorded in dependencies.yaml, not authored by T1.

