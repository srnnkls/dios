    reason: The shared loop reduced geomean from 1.0570 to 0.9998, but all 40 valid pairs still produced a one-sided CI95 upper 0.0004 above the frozen gate; only the recorded escalation lever remains admissible.
  - date: 2026-08-24
    decision: Derive disabled, enabled-idle, and enabled-ready reclaim states from one release-ring selector result.
    alternatives:
