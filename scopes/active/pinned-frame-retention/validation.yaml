      - Weaken or bypass the mise identity check.
    reason: The benchmark profile passed unchanged, and the host guard rejected only the wrapper-selected mise version; the sealed executable satisfies the frozen tool identity.
  - date: 2026-08-24
    decision: Accept the fresh v15 transient-guard lane as final-candidate evidence.
    alternatives:
