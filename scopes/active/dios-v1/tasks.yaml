    content: Portable eager backend (AD-7) — submit enqueues into bounded queue, poll executes pread/pwrite/fsync on the calling thread outside the lock, F_NOCACHE + F_FULLFSYNC/F_BARRIERFSYNC on darwin, direct-IO open probe with buffered fallback (Linux — statx STATX_DIOALIGN per opened file, write-probe fallback pre-6.1, probed alignment encoded in the open handle); eager uses the same preallocated frame slab unregistered — ring registration is uring-only
    status: done
