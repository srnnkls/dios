      (gestalt analyze), Compliance=sonnet (AGENTS.md + loqui) — all six
      dispatched in ONE message.
    known_flakiness: >-
      codex stalls often (peer retries once, then skip — proceed on
      gemini); gemini/pi stalls occasionally, usually recovers on retry.
      `peer <harness> -o file` single mode does NOT mkdir -p; use fan-out
      (-d). Reviewer noise patterns seen: sonnet flagged the nmnm/sira
      consumer names as garbled text (REJECTED — they are the consumer
      systems); gemini asked for a 512 floor in Alignment (REJECTED —
      the statx probe owns the floor).
    commit_hook: >-
      hk runs `cargo clippy --all-targets --features bench -- -D
      warnings` + `cargo fmt --check` at commit. Tester files routinely
      trip pedantic/fmt once the implementation exists — send the OWNING
      tester a style-only pass before committing (established pattern).
      `git add -A` is hook-blocked: stage explicit paths.
    remote_protocol: >-
      `mise run remote -- <cmd>` syncs the tree to host nix and runs it;
      remote target/ persists. Run the full remote suite green before
      every batch commit. T004's GREEN verification is remote-first.
      ssh failure mode: "The agent has no identities" -> user runs
      `! ssh-add ~/.ssh/id_ed25519`.
    records: >-
      Per batch append to review.yaml (test_review rounds, per-reviewer
      gates, synthesized, adjudications, fix_pass, verification,
      remote_gate, outcome), update tasks.yaml statuses + meta.progress,
      update this checkpoint — all committed WITH the batch
