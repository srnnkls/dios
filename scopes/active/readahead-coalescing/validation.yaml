review_focus:
- Original-slot continuation ownership through partial completion, abort and teardown
- Stable independent iovec memory and unique per-page ownership
- Full-vector steady-state refill including the sliding-horizon trap
- Budget/read/watermark/arena consistency and matched-budget control
- Notification races, ordered feedback, zero-CQE progress and no capacity scan on empty poll
- EOF prefix publication, terminal tail and accepted vector waste
- First-consumption notification without repeated warm-hit overhead
- Independent RC1/RC2 against immutable pre-dispatch baseline
- Small-capacity point compatibility and credit-deferred ready-stream turns
- Linear explicit protected-prefix membership/replacement work
- Retirement preserves admitted logical-read continuations
