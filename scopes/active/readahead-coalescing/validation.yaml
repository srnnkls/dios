  default_budget_rationale: >
    Depth 4 is past the knee: 1,183.67 ns per useful 4 KiB at 512 KiB versus
    1,164.53 at 1 MiB, a 1.6% difference. It leaves 368 ns/page of headroom to
    mmap's 1,552.23 for pool-layer cost. It halves the minimum pool tax (897
    versus 1,793 frames) and the speculative pollution bound. The 1 MiB row
    stays retained; raising the default later is a separate owner decision with
    that evidence. If RC-G1 fails at 512 KiB, the lever remains profiling the
    pool layer, not the budget. These separate workloads motivate the budget
    and do not prove pool performance.
