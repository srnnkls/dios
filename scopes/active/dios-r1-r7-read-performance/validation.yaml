complexity_tracking:
  - addition: full-generation file liveness mirror
    justification: removes measured warm-path mutex serialization while retaining authoritative locked recheck
    simpler_alternative_rejected: keep AD-4 on every get; contradicted by warm and contention evidence
  - addition: packed frame state and residency generation
    justification: prevents hinted ABA through frame reuse without a second transition atomic
    simpler_alternative_rejected: separate R7 mock-only stamp array; violates unused-capability overhead goal
  - addition: file lease capability
    justification: amortizes exact file-generation liveness outside the per-value loop
    simpler_alternative_rejected: per-get liveness remains the ordinary fallback but did not meet R7 materiality target
  - addition: exact PageId metadata per frame
    justification: a compact granule/frame/stamp hint otherwise admits same-granule file or pool aliasing
    simpler_alternative_rejected: widening every hint duplicates stable identity in the high-cardinality Sira descriptor and loses the measured compact shape

