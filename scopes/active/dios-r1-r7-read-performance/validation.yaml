clarification_log:
  - id: C001
    area: scope
    question: Which experimental revisions belong to this scope?
    answer: R1-R7 Dios read-path work only; R8 retention is a hard non-goal.
    integration: scope.md Goal and Non-goals
  - id: C002
    area: integration
    question: Who owns the REMIX consumer and end-to-end result?
    answer: >-
      Companion Sira scope sira-aligned-buffers; this scope owns no
      Sira file and waits on it only for DRP010 closeout.
    integration: dependencies.yaml external_dependencies
  - id: C003
    area: behavior
    question: What happens when a hint is absent, mismatched, or stale?
    answer: get_with_hint aborts an uncommitted first pin and executes ordinary Pool::get.
    integration: scope.md API contract and design.md Hinted get and fallback
  - id: C004
    area: constraints
    question: Can MockDriver close production or performance gates?
    answer: No; it is limited to deterministic correctness and fault support.
    integration: scope.md Performance plan and Non-goals
  - id: C005
    area: design
    question: Is the cheaper hash predetermined?
    answer: >-
      No. Only the full-width candidate is admissible, and the current hash is
      retained unless both distribution and real-backend speed gates pass.
    integration: scope.md DRP-G1 and design.md Hash decision
  - id: C006
    area: safety
    question: How is a compact hint bound to an exact file/page and pool?
    answer: >-
      The hint stays 16 bytes and advisory. After epoch publication and exact
      stamp validation, the target frame's preallocated full PageId metadata is
      read under EBR and compared with the supplied PageId; mismatch falls back.
    integration: scope.md R7 product capability and design.md Hinted get
  - id: C007
    area: data_model
    question: May ResidentFileLease borrow Pool?
    answer: >-
      No. It is an owned, non-Clone capability over a preallocated Arc lease
      state so pool-first drop is safe and acquisition allocates zero times.
    integration: scope.md API contract and design.md File lease

