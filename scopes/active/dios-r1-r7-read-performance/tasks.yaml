  - id: DRP003
    title: Land the conservative callable API scaffold
    description: >-
      First add one compiling runtime source-boundary RED that fails because
      the callable scaffold is absent; this check proves only API shape and
      never substitutes for a behavioral test. Then root-export the exact
      ResidentFileLease, 16-byte niche-sized ResidentHint, ResidentLeaseError,
      lease_file, resident_hint, and get_with_hint signatures needed by later
      testers. The scaffold is deliberately conservative: lease_file refuses
      with a typed stale value, resident_hint returns None, and get_with_hint
      delegates to ordinary get; it adds no atomics, unsafe code, allocation,
      mock model, frame metadata, or R8 state. Add only cfg(test)/test-util
      observation seams that expose actual production primitives. DRP004,
      DRP006, and DRP007 must each capture their own runtime failures against
      this compiling surface before changing behavior. The scaffold is an
      intermediate scope-branch state and cannot be published independently.
    status: done
    depends_on: [DRP001, DRP002]
    files:
      - src/lib.rs
      - src/pool/mod.rs
      - tests/public_api.rs

  - id: DRP004
    title: Implement generation-exact liveness mirror and ReaderSlot alignment
    description: >-
      Add the preallocated full-generation liveness words through crate::sync;
      publish on register and clear before retirement teardown with the
      design.md Release/Acquire order; use the unlocked exact check on warm get
      and preserve the locked miss-path recheck. Add #[repr(align(64))] to
      ReaderSlot without changing begin_pin, its SeqCst fence, nesting, abort,
      or release. Before code, use the DRP003 observation seam to capture a
      compiling runtime RED proving a warm hit still enters AD-4, and add the
      real-primitives mirror-get versus retire/reuse Loom RED. Make both green.
      Keep the packed hash out of this task.
    status: done
    depends_on: [DRP003]
    files:
      - src/pool/mod.rs
      - src/pool/epoch.rs
      - src/pool/loom_model.rs
      - tests/read_protocol_atomic.rs
      - tests/loom_pool.rs

  - id: DRP005
    title: Decide the admissible page hash
    description: >-
      Reproduce the existing packed-hash rejection, then evaluate only the
      design.md full-width one-round candidate. Implement and run both the
      pre-registered calibration matrix and the frozen independent holdout,
      retaining their generator/source hashes and every row, before the DRP-G1
      real-Pool<Driver> A/B. If every quality bound and the
      <=0.98 speed CI pass, adopt the candidate with distribution regression
      tests; otherwise leave the current four-round hash byte-for-byte and
      record the failed sub-gate. Either branch completes this task. Never
      relax a threshold after observing results and never ship the packed
      expression.
    status: done
    depends_on: [DRP004]
    files:
      - src/pool/table.rs
      - tests/read_protocol_atomic.rs
      - benches/read_path_product.rs
      - benches/plans/dios_r1_r7_read_performance.md
      - Cargo.toml
      - scopes/active/dios-r1-r7-read-performance/resources/hash-decision.yaml

  - id: DRP006
    title: Implement production file lease and packed residency stamp
    description: >-
      Translate the manifest-bound R7 behavior, not its mock gating or R8
      neighbors. Add one preallocated Arc<ResidentLeaseState> per file slot,
      with its AtomicU32 lease count and wake state; acquisition is AD-4
      serialized and clones the existing Arc without allocation. Implement the
      owned, lifetime-free, non-Clone ResidentFileLease so pool-first drop is
      safe and last drop performs bounded retirement wake progress. Add typed
      stale/exhausted acquisition and the single AtomicU64 frame state+
      generation word from design.md. Route proof-bearing atomics through
      crate::sync and update alias-guard coverage. Export the production types
      for every PoolBackend. Before code, capture compiling runtime REDs against
      the DRP003 scaffold for live/stale/exhausted acquisition, non-Clone
      ownership, pool-first drop, retirement/reopen, and lease-acquire versus
      retire/full-retirement/file-slot-reuse Loom. Preserve ordinary FrameState
      transitions and make those REDs green. ResidentSet and retention symbols
      are forbidden only in the isolated R7 carrier and this scope's delta.
    status: done
    depends_on: [DRP004]
    files:
      - src/pool/frames.rs
      - src/pool/mod.rs
      - src/pool/alias_guard.rs
      - src/sync.rs
      - src/lib.rs
      - tests/public_api.rs
      - tests/guard_compile_fail.rs
      - tests/resident_hint.rs

  - id: DRP007
    title: Implement compact hint, mandatory fallback, and reuse proofs
    description: >-
      Add the opaque 16-byte ResidentHint, lock-free advisory minting,
      preallocated per-frame exact-PageId metadata, and get_with_hint. The
      single writer stores bytes and PageId before Release-publishing Resident;
      the reader publishes through the unchanged ReaderSlot protocol, compares
      the exact packed stamp with Acquire, then reads and compares the full
      PageId through one audited Frames unsafe cell before touching CLOCK and
      returning the normal FrameGuard. None or any stale/mismatched
      observation must abort only an uncommitted first pin and invoke ordinary
      get; an out-of-range frame index must fall back before frame indexing,
      and no separate consumer-side fallback protocol exists. Before code,
      capture compiling runtime REDs against the live DRP006 lease plus the
      DRP003 hint scaffold for mint/hit/fallback/refresh, exact PageId, nested
      fallback, and hinted publication versus unmap/eviction/two advances/
      refill/reuse Loom. Include same-granule wrong-file and wrong-pool
      collisions. Make those REDs green.
      Add deterministic mock fault/byte tests only as correctness support,
      never as the gate result.
    status: done
    depends_on: [DRP006]
    files:
      - src/pool/frames.rs
      - src/pool/mod.rs
      - src/pool/alias_guard.rs
      - src/pool/loom_model.rs
      - src/lib.rs
      - src/mock.rs
      - tests/resident_hint.rs
      - tests/loom_pool.rs

  - id: DRP008
    title: Close correctness, allocation, and sanitizer matrix
    description: >-
      Run and close the full acceptance matrix: wrong pool/file/page with
      deliberately colliding granule/frame/stamp shapes, an out-of-range frame
      index that falls back before indexing,
      None/stale/refresh, lease exhaustion without mutation, retire with a
      live lease, pool-first lease drop, last-drop progress, same-slot reopen,
      ordinary get unchanged,
      exact bytes, trait/lifetime pins, frame-generation transition assertions,
      and forbidden R8 symbol scans limited to the isolated R7 carrier and this
      scope's own delta. Extend zero_alloc for ordinary hit, hinted
      hit, stale fallback, lease acquire/drop, and retirement on eager and
      io_uring. Run fmt, strict clippy, full tests, bounded Loom cases, miri on
      pure memory, and asan on the Linux syscall lane.
    status: done
    depends_on: [DRP005, DRP007]
    files:
