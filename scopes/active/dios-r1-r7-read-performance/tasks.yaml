tasks:
  - id: DRP001
    title: Freeze R1-R7 production bench plan
    description: >-
      Before product code, write one plan containing DRP-G1 through DRP-G4
      exactly as scope.md specifies: metric and direction, real Pool<Driver>
      workload, clean-base/candidate identities, CPU affinity and governor,
      at least 30 order-alternated process pairs, one-sided 95% CI thresholds,
      ratio orientation, shared compare commands, retained raw CSV/provenance,
      and an escalation lever for each failure. Include both the historical
      hash calibration matrix and design.md's exact independent holdout before
      any candidate edit, full-granule binding lanes, cycling/reuse default-
      overhead lane, ordinary-vs-hint materiality, and 1/8-thread contention.
      State that MockDriver and the one-word lane are diagnostic only. Amend
      read-protocol-atomic and active dios-v1 T018/DIO-G10 to assign overlapping
      primitive implementation here while preserving their evidence and
      migration-level consumer gates.
    status: done
    depends_on: []
    files:
      - benches/plans/dios_r1_r7_read_performance.md
      - scopes/draft/read-protocol-atomic/
      - scopes/active/dios-v1/

  - id: DRP002
    title: Extract and bind R7-only source
    description: >-
      Starting from clean 1004a2e6fcae0bcc9552dc3211c2416e388a250d, verify
      SHA-256 16748dd827b1958b6889535f7244fb8ffe767dac674d587f9fee18738be4a967
