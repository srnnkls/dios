review_focus:
  - R7 extraction is reproducible from the recorded base/carrier hashes and excludes every R8 retention symbol.
  - The liveness mirror ordering and locked miss recheck make get-vs-retire linearizable.
  - The packed frame stamp plus unchanged epoch fence excludes two-advance reuse ABA.
  - Exact per-frame PageId metadata and a pre-index bounds check exclude foreign bytes; a coincidental exact target-page match is safe.
  - Hint failure always reaches ordinary get without leaking an epoch publication.
  - Calibration plus independent hash holdout, unused-overhead, shipping-backend materiality, and contention gates are executable and falsifiable.
  - No task owns a Sira file; SAB008 blocks only DRP010; retention is serialized after DRP010 without importing R8 behavior.

