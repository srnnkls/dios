assumptions:
  - id: A001
    area: behavior
    question: "Is an entry-only bracket exact for the optimistic copy?"
    assumed: "No. Comparing the entry before and after cannot see a page evicted and republished into the same frame unless the entry carries a version, and a version that fits can repeat while a reader is descheduled. The entry is a 4-byte frame reference without a version, and acceptance observes it between two equal frame-stamp loads (62-bit generation). Identity cells leave the read path as selected."
    load_bearing: true
    status: confirmed
    confirmed_at: 2026-11-15
    source: scope
  - id: A002
    area: behavior
    question: "What does a session read do on a miss?"
    assumed: "It returns Absent and submits nothing; the caller takes the ordinary get, inside or outside the session."
    load_bearing: true
    status: confirmed
    confirmed_at: 2026-11-15
    source: scope
  - id: A003
    area: integration
    question: "How do the bound and the swap show in the public API?"
    assumed: "A granule at or above file_granules_max returns GetError::BeyondFileBound on every read verb; the default bound is 2^22 granules (revised from 2^28 by Q006); the public PageTable type, page_hash, the DRP-G1 probe binary and the table_population bench are removed with their evidence retained."
    load_bearing: true
    status: revised
    confirmed_at: 2026-11-15
    source: scope
  - id: A004
    area: constraints
    question: "What session length do the gate lanes pin?"
    assumed: "Sessions of 16 requests, matching resident_access_epoch_batch; a session per read measured 2.48 to 2.56 on M1 and is reported in the sweep, not gated."
    load_bearing: true
    status: confirmed
    confirmed_at: 2026-11-15
    source: scope
  - id: A005
    area: scope
    question: "Do resident hints, file leases and retained handles change?"
    assumed: "No. They keep their surface and are re-based on the array; removing hints is a later owner decision."
    load_bearing: false
    status: assumed
    source: scope
  - id: A006
    area: integration
    question: "What happens to the warm-read-copy-out draft?"
    assumed: "AT1 adds a successor pointer to it; moving it out of draft is the owner's call after this scope's review passes."
    load_bearing: false
    status: assumed
    source: scope

  - id: A007
    area: edge_cases
    question: "What do prefetch paths do at the granule bound?"
    assumed: "Explicit prefetch counts an out-of-bound page in the existing rejected field; automatic readahead windows end below the bound; translation writers assert the bound."
    load_bearing: false
    status: assumed
    source: scope-review
  - id: A008
    area: constraints
    question: "Are session slices thread-confined?"
    assumed: "No. ReadSession and SessionFile are neither Send nor Sync; a slice is an ordinary reference bound to the session's lifetime, as with FrameGuard."
    load_bearing: false
    status: assumed
    source: scope-review
  - id: A009
    area: data_model
    question: "How is a slot smaller than an OS page released?"
    assumed: "It is not. Release covers only whole OS pages inside a slot's range and never rounds outward."
    load_bearing: false
    status: assumed
    source: scope-review

