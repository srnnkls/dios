review_focus:
- Soundness of the entry, stamp, entry, copy, fence, stamp, mirror order under Acquire and Release with the control lock as the only writer order
- INV-2 at every writer: publish, eviction, retirement, prefetch eviction, and the Loom model
- Session borrow soundness against reclamation, retirement and slot reuse
- Whether per-read liveness is necessary and sufficient for INV-7
- Translation reservation, the power-of-two bound and release at retirement on both backends
- Gate definitions, session length, hugepage witness and the AT-G1 margin
- Task file sets and dependencies for parallel dispatch

