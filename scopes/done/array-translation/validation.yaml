  - id: AT-D9
    decided_at: 2026-11-17
    owner: Sören
    decision: "The benches against mmap are made fair and comparable, informed by subagent research on benchmarking against mmap, and without cheating: no harness change removes a cost that a real caller of the product API pays, no product change is made for the bench alone, bounds stay as recorded and retained results keep their standing. Trigger: on resident_access_ordinary the get arm pays about 7 of 35 ns per read in harness-only call layers and result re-wrapping that the mmap arm lacks (scratch measurement on nix, 2026-11-17)."
  - id: AT-D10
    decided_at: 2026-11-17
    owner: Sören
    decision: "The legacy resident lanes (resident_access_ordinary, _hinted, _epoch_batch, _retained, _page_batch, resident_projection, resident_decode and the characterization mode of mmap_tlb_pressure) are frozen byte for byte and labelled harness-shape lanes. The session and copy arms, a fair get arm and a plain-array floor arm live in a new module that follows the fairness contract of the bench plan. The AT4 change to the shared finish function is reverted."
  - id: AT-D11
    decided_at: 2026-11-17
    owner: Sören
    decision: "The ratio bounds of AT-G1, AT-G5 and AT-G6 and the shared non-inlined fold stay as selected on 2026-11-14. Every gate additionally reports ns per read for each arm, their difference with its interval, a plain-array floor arm, and an inlined-fold variant as characterization."
  - id: AT-D12
    decided_at: 2026-11-17
    owner: Sören
    decision: "AT-G3 keeps its bound and is scoped to what it measures: a hugepage-backed arena against ext4 mmap with 4 KiB pages, under a separate recorded THP=madvise host profile pinned in its manifest. A row with the arena on 4 KiB pages is reported and not gated. The arm is CPU-pinned, draws over all 65,536 pages and runs on the shipping backend."
  - id: AT-D13
    decided_at: 2026-11-17
    owner: Sören
    decision: "AT-G1, AT-G5 and AT-G6 are each captured on three builds with perturbed code layout, recorded in their manifests, 30 pairs per build, and pass only when all three pass."
  - id: AT-D14
    decided_at: 2026-11-17
    owner: Sören
    decision: "The scope is expanded by a get hit-path task after AT5 with its own gate: a register-sized hit result, an inlinable fast path with the slow path out of line, and deduplicated assertions. It does not ride along in the session work."
  - id: AT-D15
    decided_at: 2026-11-17
    owner: Sören
    decision: "AT-G8 bounds the get hit after the hit-path change against get as AT5 leaves it at 0.85, on the fair get lane, with one runner source built against both trees; the AT-G7 lanes must still pass."
  - id: AT-D16
    decided_at: 2026-11-17
    owner: Sören
    decision: "In the session lanes the mmap and floor arms iterate the same 16-request chunks as the session arm, with nothing at the chunk boundary, so the gated ratio isolates the session API; the flat-loop mmap arm is captured and reported beside it in every report and is not gated. Evidence: on nix the chunked loop alone costs the mmap arm 0.73 ns per read (3.68 against 4.41, scratch build of 3e373a9); AT4's first review required the same loop shape and the fair-lane rewrite dropped it. The change moves AT-G1 in the product's favour: about 1.57 against the flat loop and about 1.31 against the chunked loop after the lever wave."
  - id: AT-D17
    decided_at: 2026-11-18
    owner: Sören
    decision: "FR-12 and AC-20 are amended: a get hit on a frame whose CLOCK reference is already set executes no call into the crate; the first reference to a frame after a sweep cleared its bit takes one cold out-of-line call, as in the session read. Rejected inlining the first-reference work into every caller. Raised by the AT9 review (general-peer-gpt6-astra) against FR-12 as first written."
  - id: AT-D18
    decided_at: 2026-11-19
    owner: Sören
    decision: "AT-G1 fails on two of three layout builds at fdada37 (CI95 upper 1.5112, 1.5541, 1.4619; bound 1.50) with the session loop's machine code unchanged since 377a0ad, where all three passed. The bench plan's lever 'validate liveness once per file and delay slot reuse by a reclamation grace period' is approved in principle; its design follows research and is recorded as a scope amendment before any code."
  - id: AT-D19
    decided_at: 2026-11-19
    owner: Sören
    decision: "For the liveness lever (AT-D18): reuse of a retired file's slot and the OS close of its handle wait until the global epoch has advanced twice past the store that cleared the slot's mirror; meanwhile registration finding no free slot returns the existing AtCapacity error, and RetireStatus::Retired is reported only after that grace period. No new error variant or status. Design source: .tropos/peer/array-translation/20261115T161731Z-fba2be/research-liveness-hoisting/report.md, option (a)."
  - id: AT-D20
    decided_at: 2026-11-19
    owner: Sören
    decision: "Before the scope is amended, a scratch campaign in a throwaway worktree prices on the three layout builds: the grace period alone; with the CLOCK reference bit in the translation entry; with a fused session-and-file open; and their combination. The amendment takes the smallest combination that clears AT-G1 with about 0.2 ns margin; the CLOCK-bit variant changes INV-1 and returns to the owner if chosen. What a session returns for a file retired while it holds it is decided after a focused research pass (owner leaning: keep returning that file's own resident bytes or Absent until the session drops)."
  - id: AT-D21
    decided_at: 2026-11-19
    owner: Sören
    decision: "Mid-session retirement semantics (A): a SessionFile sees retirement only if it began before ReadSession::file; afterwards it keeps returning that file's own resident granules or Absent until its session drops, never another file's or granule's bytes; get, read_copy, lease_file, submissions and new sessions see retirement from the first retire_file call; RetireStatus::Retired is the barrier after which no reader can observe the file. The caller protocol 'retire the file and wait for Retired before changing it in place' is documented, and the edge cases (live leases, miss waiters, a pre-retirement miss publishing late, waiting for Retired while holding a session) are documented behaviour, not code. Contract wording: .tropos/peer/array-translation/20261115T161731Z-fba2be/research-session-retirement/report.md. Rejected: stale per read (B), retirement waiting for holders (C), StaleFile on Absent (D1) for now."
  - id: AT-D22
    decided_at: 2026-11-19
    owner: Sören
    decision: "AT-G1 is pursued with the grace period (AT-D19) plus a fused session-and-file open, accepting about 0.10 ns of margin on layout 32 as the scratch campaign measured; the CLOCK reference bit in the translation entry is rejected (no measurable gain, would change INV-1). If a formal layout capture fails on placement, it returns to the owner; code layout is not tuned to pass. Evidence: scratch campaign on nix, 2026-11-19, five variants on three layouts (worktrees and outputs under ~/build/dios-scratch-liveness*)."
  - id: AT-D23
    decided_at: 2026-11-19
    owner: Sören
    decision: "One fresh 30-pair rerun of RC-G1 (cold and pressure) is authorized at the product code of c89d43a. The first capture aborted on the steady-interval witness: one interval of one candidate row in the 128 MiB pressure case touched 34 read SQEs (33 speculative plus one demand read of a covered page) instead of at most 33; the cold case had completed at 0.832. Twelve diagnostic pressure captures, six at the current head and six at 5131d7d, completed with zero violations in about 1,150 intervals. The aborted capture and the diagnostic runs are retained; the rerun decides RC-G1."
  - id: AT-D24
    decided_at: 2026-11-20
    owner: Sören
    decision: "AT-G1 is decided on the 90 measured pairs pooled across its three layout builds, bound 1.50 unchanged; each build is still captured under its own frozen manifest and its result reported beside the pooled one. Amends AT-D13 for AT-G1 only; AT-G5 and AT-G6 keep all three builds passing. Reason: code placement moves the ratio by about 0.15 across builds with unchanged hot-loop code, so all-three-pass decides on the worst placement. Evidence at 6ba0592: CI95 upper 1.4000, 1.4909 and 1.5537 on layouts 16, 32 and 64, pooled 1.4830 (informational, before this decision); at fdada37 layouts 16 and 32 failed and 64 passed; the session arm runs 78.5 instructions per read against 84.1 before the liveness wave at unchanged cycles, with branch mispredicts 90 to 98 per 1,000 reads against 81 at 377a0ad (benches/evidence/array_translation/README.md, 7730cf6, fe24b27)."
  - id: AT-D25
    decided_at: 2026-11-22
    owner: Sören
    decision: "ReadCopy carries no lifetime: `enum ReadCopy { Copied, Pending(PendingToken), Busy }`, and `Pool::read_copy` returns `Result<ReadCopy, GetError>`. Amends the API Contract row of `Pool::read_copy`. Reason: the outcome borrows nothing (Copied writes into the caller's buffer, Pending holds a PendingToken), so the pinned `ReadCopy<'_>` needed a public `PhantomData` field on Copied that callers could construct (AT6 scaffold, b7-implementer-AT6)."
  - id: AT-D26
    decided_at: 2026-11-23
    owner: Sören
    decision: "AT-G5 and AT-G6 failed on all three layout builds at d1a6f9d (dios_copy 33.5 ns per 64-byte copy against 4.95 for mmap_copy and 5.2 for the optimistic floor; CI95 upper 6.84 to 6.86 and 5.95 to 6.52). The exact-arm profile shows 512 instructions per copy, one memmove call per payload word from a run-time-length slice copy, and an out-of-line Frames::state_word. AT7 takes one fix wave: the payload copy moves whole words as u64 values with the partial-word edges kept, and Frames::state_word inlines; no fence, FrameState, witness, bound or batching change (plan lever). The six manifests are refrozen at the fixed tree and AT-G5 and AT-G6 recaptured on three layout builds; the failing d1a6f9d captures stay retained (benches/evidence/array_translation/README.md, 340ed01)."
  - id: AT-D27
    decided_at: 2026-11-23
    owner: Sören
    decision: "AT-G5 and AT-G6 failed again at a1a253b after AT-D26 (dios_copy 16.6 ns per copy; CI95 upper 3.40 to 3.43 and 2.96 to 3.25). Diagnosis on nix: 7.98 non-forwardable store-to-load interlocks per copy (ls_bad_status2.stli_other) against 0.001 for mmap_copy and 0.002 for the floor; the caller's reads of the output cannot forward from read_copy's eight 8-byte stores. One more fix wave inside the word-load contract (WRC-D1: one volatile 8-byte load per word): write the output with stores wide enough for a reader's loads to forward, and remove the repeated range assertion; then refreeze and recapture. Plan lever unchanged (no fence, FrameState, witness, bound or batching change). AT-G6's bound against a translation-free floor may stay out of reach (benches/evidence/array_translation/at-g5/profile/, af20c5d)."
  - id: AT-D28
    decided_at: 2026-11-23
    owner: Sören
    decision: "After AT-D26 and AT-D27, dios_copy takes 67.6 cycles and 251.7 instructions per 64-byte copy against 22.9 and 77.7 for the optimistic floor and 21.6 and 69.6 for mmap_copy (nix, layout-32 smoke runner of 36f9909; predicted ratios about 3.1 and 2.95). The remaining cost is per-call overhead spread over read_copy: identity and range checks, bounds-checked translation and stamp lookups, and a Result<ReadCopy, GetError> returned through memory, the shape get had before AT9. A new task AT10 gives read_copy an AT9-style fast path (FR-13, AC-25): an inlinable accepted optimistic copy with a register-sized private result, fallback and error outcomes out of line, every assertion kept once, public signature unchanged. AT7 stays open on AT10; AT-G5 and AT-G6 are refrozen and recaptured after AT10; no recapture of 36f9909. Plan lever unchanged."
  - id: AT-D29
    decided_at: 2026-11-23
    owner: Sören
    decision: "AT10 lands although it does not reach its bound: an accepted copy now inlines into the caller with no call into dios and one cold exit, 51.5 cycles and 186.6 instructions per 64-byte copy against 21.6 and 69.6 for mmap_copy (2.38x; nix, layout-32 smoke runner). With every copy-path assertion kept once, per-call validation and WRC-D1, the accepted path stays near 130 instructions; the bounds 1.50 (AT-G5) and 1.20 (AT-G6) are not reachable for a per-call copy, and batching is excluded by the plan lever. AT-G5 and AT-G6 are refrozen and recaptured once on three layout builds for the record; their failure records the copy-out read as not adopted on performance (read_copy stays in the tree; sira keeps its own copy path, WRC-D2). AT7 and AT10 close on that record; AT8 follows."
  - id: AT-D30
    decided_at: 2026-11-24
    owner: Sören
    decision: "AT8 campaign at 81a2f18: one fresh 30-pair rerun each of RC-G1 (cold and pressure) and RC-G4 automatic_dependent under the frozen at-g7.json is authorized. RC-G4 automatic_dependent failed at CI95 upper 1.0484 (bound 1.02) on one outlier pair at 1.605 (median 1.0004, the other 29 pairs 0.993 to 1.003), as the fragmented lane did at 5131d7d before its authorized rerun; RC-G1 aborted on the steady-interval witness in the pressure case with the cold case complete, the AT-D23 pattern. The failed and aborted captures are retained; the reruns decide."
  - id: AT-D31
    decided_at: 2026-11-25
    owner: Sören
    decision: "AT8 characterization harness: the read_copy accepted/fallback split on pressure_random comes from a bench-feature counter incremented only inside the cold out-of-line read_copy_fallback (the accepted path gets no instruction; accepted = copies minus fallbacks); evictions on pressure_random are derived from existing pool statistics from a cold start (admitted misses minus frame count plus evicted_unused), with a test pinning the identity on a small pool. The translation-memory report reads the mapping through a bench-feature getter on Pool with a build.rs probe for trees without it; the pressure harness dispatch in benches/mmap_workloads/engine.rs gains the dios_copy arm outside every per-read loop. Gated lanes, arms and timed regions are unchanged."
  - id: AT-D32
    decided_at: 2026-11-25
    owner: Sören
    decision: "The read_copy fast/fallback counts and evictions on pressure_random are dropped from AT8 (amends AT-D31). Building them broke AC-19's legacy-lane pin (engine.rs and resident.rs at 604410a) and changed the gated dios_copy_loop's machine code (306 to 298 instructions through inlining), while their smoke on nix showed no first-attempt copy under pressure (about 20 % Pending, 80 % Busy). That smoke result is recorded as a characterization note; translation memory and the session-length sweep stay."
  - id: WRC-D1
    inherited_from: scopes/draft/warm-read-copy-out/validation.yaml
    decision: "Volatile-word exception, same-width atomic writers, one audited module, mirror-only liveness carry over; the bracket is amended by Q005 and A001."
  - id: WRC-D2
    inherited_from: scopes/draft/warm-read-copy-out/validation.yaml
    decision: "Copy bounds 1.50 against the mmap copy and 1.20 against the floor; sira keeps SAB006."
  - id: WRC-D3
    inherited_from: scopes/draft/warm-read-copy-out/validation.yaml
    decision: "DRP-G4 eight-thread protocol amendment of 2026-09-14."

assumptions:
  - id: A001
    area: behavior
    question: "Is an entry-only bracket exact for the optimistic copy?"
    assumed: "No. Comparing the entry before and after cannot see a page evicted and republished into the same frame unless the entry carries a version, and a version that fits can repeat while a reader is descheduled. The entry is a 4-byte frame reference without a version, and acceptance observes it between two equal frame-stamp loads (62-bit generation). Identity cells leave the read path as selected."
    load_bearing: true
    status: confirmed
    confirmed_at: 2026-11-15
    source: scope
  - id: A002
    area: behavior
    question: "What does a session read do on a miss?"
    assumed: "It returns Absent and submits nothing; the caller takes the ordinary get, inside or outside the session."
    load_bearing: true
    status: confirmed
    confirmed_at: 2026-11-15
    source: scope
  - id: A003
    area: integration
    question: "How do the bound and the swap show in the public API?"
    assumed: "A granule at or above file_granules_max returns GetError::BeyondFileBound on every read verb; the default bound is 2^22 granules (revised from 2^28 by Q006); the public PageTable type, page_hash, the DRP-G1 probe binary and the table_population bench are removed with their evidence retained."
    load_bearing: true
    status: revised
    confirmed_at: 2026-11-15
    source: scope
  - id: A004
    area: constraints
    question: "What session length do the gate lanes pin?"
    assumed: "Sessions of 16 requests, matching resident_access_epoch_batch; a session per read measured 2.48 to 2.56 on M1 and is reported in the sweep, not gated."
    load_bearing: true
    status: confirmed
    confirmed_at: 2026-11-15
    source: scope
  - id: A005
    area: scope
    question: "Do resident hints, file leases and retained handles change?"
    assumed: "No. They keep their surface and are re-based on the array; removing hints is a later owner decision."
    load_bearing: false
    status: assumed
    source: scope
  - id: A006
    area: integration
    question: "What happens to the warm-read-copy-out draft?"
    assumed: "AT1 adds a successor pointer to it; moving it out of draft is the owner's call after this scope's review passes."
    load_bearing: false
    status: assumed
    source: scope

  - id: A007
    area: edge_cases
    question: "What do prefetch paths do at the granule bound?"
    assumed: "Explicit prefetch counts an out-of-bound page in the existing rejected field; automatic readahead windows end below the bound; translation writers assert the bound."
    load_bearing: false
    status: assumed
    source: scope-review
  - id: A008
    area: constraints
    question: "Are session slices thread-confined?"
    assumed: "No. ReadSession and SessionFile are neither Send nor Sync; a slice is an ordinary reference bound to the session's lifetime, as with FrameGuard."
    load_bearing: false
    status: assumed
    source: scope-review
  - id: A009
    area: data_model
    question: "How is a slot smaller than an OS page released?"
    assumed: "It is not. Release covers only whole OS pages inside a slot's range and never rounds outward."
    load_bearing: false
    status: assumed
    source: scope-review

review_config:
