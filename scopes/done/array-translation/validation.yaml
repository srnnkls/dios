  reviewers:
  - peer-gpt6-astra
  - peer-opus

liveness_amendment_review_gate:
  status: passed
  amended_at: '2026-11-19'
  subject: "Owner decisions AT-D18 to AT-D22: liveness once per view, grace period on slot reuse, fused open, mid-session semantics"
  reviewers:
  - peer-gpt6-astra
  - peer-opus
  effort: high
  reports: .tropos/peer/scope-array-translation/20261119T140048Z-1b8b32/
  blocking_resolved: 2
  medium_resolved: 4
  fix_rounds: 2
  targeted_reviewer: peer-opus
  reason: Two high and four medium findings named concrete defects and were folded; the
    targeted re-review found three folds clean and one residual (a get paused after its
    pin blocks the grace period, so the old deterministic slot-reuse window for get
    cannot occur), which the second fold restates for get. The second fold was not
