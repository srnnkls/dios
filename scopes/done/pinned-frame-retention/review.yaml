        resolution: wake gated on parks_in_progress > 0 AND push-into-empty-ring; promote/release arm promoted to a GATED A/B
      - id: R3-H4
        severity: high
        description: Release ring MPSC algorithm, orderings, and full behavior unspecified; plain tag slots not expressible in safe Rust behind &Retention; unbounded CAS loops vs the fixed-retry rule
        found_by: [opus, codex-gpt5.6-sol]
        resolution: sequence-numbered bounded MPSC specified (Release push/Acquire pop, full unreachable + asserted, bounded claim); tag slots become Relaxed AtomicU64 under AD-4 mutual exclusion; drop made loop-free (single fetch_sub), promotion loop init-bounded refusing Exhausted, drain loop count-bounded
      - id: R3-H5
        severity: high
        description: Same-frame spurious refusal at the budget boundary contradicted the stated never-refused guarantee
        found_by: [codex-gpt5.6-sol]
