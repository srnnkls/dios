      design_depth: { status: fail, failed_by: [opus, codex-gpt5.6-sol] }
    synthesized_issues:
      - id: H1
        severity: high
        description: PinRefusedReason::Maturing unreachable — a live guard at epoch E bounds the global epoch to E+1, so the frame's evict entry can never mature
        found_by: [opus, codex-gpt5.6-sol, gemini-3.5-flash]
        verified: tests/epoch_guards.rs live-guard-limbo test read by orchestrator
        resolution: variant removed; reachability invariant recorded and asserted (design.md)
      - id: H2
        severity: high
        description: INV-9 delta formula contradicted PoolBuilder::validate and the owning dios-v1 scope (phantom inflight term; scope.md and design.md disagreed)
        found_by: [opus, codex-gpt5.6-sol]
        verified: src/pool/mod.rs:474-483 read by orchestrator
        resolution: delta restated against the code formula; BelowWatermark reports augmented watermark
      - id: H3
        severity: high
        description: Deferred unpin re-enqueue had no mechanism and its no-lock/no-MPSC rationale was self-defeating (drops are multi-producer)
        found_by: [opus, codex-gpt5.6-sol]
        resolution: fixed-capacity MPSC release ring sized max_retained_frames, poll-side single consumer under AD-4; tech decision corrected
      - id: H4
        severity: high
        description: PinnedEvicted ambiguously specified as both orthogonal flag and FrameState member; FrameState is closed, assert-guarded, public
        found_by: [opus, codex-gpt5.6-sol]
        resolution: decided — no FrameState variant; packed per-frame AtomicU32 (count + HELD) with CAS protocol
      - id: H5
        severity: high
        description: Held retention blocks Pool::retire_file indefinitely with no requirement covering it
        found_by: [opus]
        verified: progress_retirements/retire_file_frames read by orchestrator
        resolution: FileRetiring refusal for retiring files; documented observable wait; per-file count deferred (nit)
      - id: H6
        severity: high
        description: Task file lists did not match code layout (FrameGuard lacks frame index/pool backref; product.rs/error.rs wrong homes; loom model lives in src/pool/loom_model.rs)
        found_by: [opus, codex-gpt5.6-sol]
        verified: FrameGuard struct read by orchestrator
        resolution: file lists corrected across T2-T9; ManuallyDrop and FrameGuard field additions recorded
      - id: H7
        severity: high
        description: Unpin-to-zero racing drain_matured's count read can strand a frame (flagged HELD with count 0, never released)
        found_by: [gemini-3.5-flash]
        resolution: single packed word + full-word CAS on both sides; unique release ownership on the (1,HELD)->(0,clear) transition
      - id: H8
        severity: high
        description: Bench-plan-before-code violated — T2 could start alongside T1; plan lacked preregistered gate fields
        found_by: [opus, codex-gpt5.6-sol]
        resolution: T1 gates the DAG (all code tasks transitively depend on it); required plan fields enumerated in T1
      - id: H9
        severity: high
        description: Verification lacked acceptance-test matrix, zero-alloc/miri/asan lanes, retirement and recovery cases
        found_by: [codex-gpt5.6-sol]
        resolution: acceptance matrix in scope.md; T7 sanitizer/zero-alloc task added
      - id: M1
        severity: medium
        description: Fresh two-epoch grace on last unpin unsound as rationale (no guard can exist; remove_shared precedes eviction) and costs availability
        found_by: [opus]
        verified: remove_shared call sites read by orchestrator
        resolution: direct Evicting -> Free at poll boundary with asserted justification
      - id: M2
        severity: medium
        description: '"pin" overloaded between the EBR epoch verb and the new refcount'
        found_by: [opus]
        resolution: retain vocabulary adopted (RetainedFrame, into_retained, RetainRefused, max_retained_frames)
      - id: M3
        severity: medium
        description: max_pinned_frames denomination ambiguous (frames vs handles); default and rollback unspecified
        found_by: [opus, codex-gpt5.6-sol]
        resolution: distinct frames, 0->1/1->0 tally with reserve-rollback; default 0 with stated consequence
      - id: M4
        severity: medium
        description: PollReport::reclaimed_frames accounting for HELD pops unspecified
        found_by: [opus]
        resolution: HELD pops excluded; test pins reported == frames reaching Free
      - id: M5
        severity: medium
        description: No observability for refusals or retention occupancy
        found_by: [opus, codex-gpt5.6-sol]
        resolution: retained-in-use and refusal counters beside lifecycle counters
      - id: M6
        severity: medium
        description: Debug contract referenced FrameGuard len-only Debug that does not exist (FrameGuard derives Debug)
        found_by: [codex-gpt5.6-sol]
        resolution: RetainedFrame Debug specified independently; comparison removed
    decisions_from_clarifying_questions:
      - RetainedFrame keeps shared pool + ReaderCtx borrows (all read ops take &self; acceptable for sira's Connection-owned ReadCore)
      - Stale-snapshot semantics on PageId re-admission documented; exact for immutable-file consumers
