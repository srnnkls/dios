      - id: R2-H3
        severity: high
        description: Promotion needed AD-4 state (FileRetiring via file registry, maturity via evict tags), contradicting the one-CAS complexity claim and serializing sira's per-read promotions; promotion-vs-retire linearization unspecified
        found_by: [opus, codex-gpt5.6-sol]
