      - id: R2-M3
        severity: medium
        description: Loom model has one ReaderSlot — concurrent last-drop scenarios inexpressible
        found_by: [opus]
        resolution: T6 gains a second ReaderSlot and per-thread pin entry
      - id: R2-M4
        severity: medium
        description: not-Clone bound unpinned; ReaderCtx lifetime relation unpinned; by-reason vs singular counter inconsistency; B5 file-ownership overlaps; zero-budget poll-boundary cost question
        found_by: [opus, codex-gpt5.6-sol]
