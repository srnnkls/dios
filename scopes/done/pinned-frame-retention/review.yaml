      - id: R2-H6
        severity: high
        description: Observability surface is pub(crate)/mock-gated (MockPoolObservation, Pool<MockDriver> only) — the promised consumer signal did not exist; tasks omitted src/product.rs and src/lib.rs
        found_by: [opus, codex-gpt5.6-sol]
        resolution: public retention-stats accessor on Pool, pinned in tests/public_api.rs; task files corrected
      - id: R2-H7
        severity: high
        description: u16 per-frame count exhaustion was an assert/panic — AGENTS.md requires exhaustion to be a value; contradicted the exhaustive refusal enumeration
        found_by: [opus, codex-gpt5.6-sol]
