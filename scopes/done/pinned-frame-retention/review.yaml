scope: pinned-frame-retention
rounds:
  - round: 1
    date: 2026-08-17
    reviewed_revision: 1
    reviewers: [opus, codex-gpt5.6-sol, gemini-3.5-flash]
    gates:
      completeness: { status: fail, failed_by: [opus, codex-gpt5.6-sol] }
