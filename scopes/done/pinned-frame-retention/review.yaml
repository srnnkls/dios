    date: 2026-08-19
    reviewed: true
    basis: >
      R8 demonstrated the useful performance shape (bounded setup,
      precomposed integer descriptors, zero per-read pins) but its mock-only
      retention array had no pool-wide budget and kept retained frames
      Resident by rejecting CLOCK victims. Revision 9 preserves the consumer
      shape while retaining revision 8's reviewed logical-eviction/HELD
      mechanism.
    changes: >
      Added a hash-bound R8 evidence resource; made session-level promotion
      and sequential descriptor consumption the primary benchmark shape;
      explicitly kept production Sira composition outside this Dios scope;
      added retained_evictions_held observability at the matured
      Evicting-to-HELD transition; and prohibited R8-style retained-victim
      skipping. Recorded that the exact 8,035-page shipping rerun is impossible
      under the pinned host's measured 8 MiB hard memlock limit and left the
      host-limit/unregistered-buffer/scaled-workload fork as an explicit owner
      decision before T1 freezes the arm. Follow-up consistency work serialized
      implementation after the complete R1-R7 DRP010 branch and replaced
      missing-API/verification-only task exceptions with one conservative
      callable scaffold plus task-local compiling runtime REDs.
    sequencing: >
      The paired R1-R7 Sira/Dios performance scopes are separate and exclude
      R8 retention. A later Sira integration task owns the actual session
      owner table and fallback. cache-semantics-injection remains independent:
      its proposal-rejected seam covers non-Resident and miss-interest
      rejection only.
    gate_status: >
      Revision 9 passed focused final review. Implementation remains blocked
      by DRP010 serialization and the explicit shipping-memlock owner choice;
      no review result authorizes one of those branches implicitly.

