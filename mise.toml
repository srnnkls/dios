[tools]
rust = { version = "1.96.0", profile = "default" }   # pinned; default profile ships clippy+rustfmt (mise's rustup default is minimal)
hk = { version = "1.47.0", postinstall = "hk install --mise", depends = ["pkl"] }
pkl = "0.31.0"
actionlint = "1.7.12"

[tasks.build]
run = "cargo build"

[tasks.test]
run = "cargo test --features bench,mock"

[tasks.test-ci]
description = "Run CI tests without product-backed benchmark smokes"
run = "cargo test --features mock"

[tasks.fmt]
run = "cargo fmt"

[tasks.lint]
description = "clippy (pedantic, warnings as errors) + rustfmt check"
run = ["cargo clippy --all-targets --features bench,mock -- -D warnings", "cargo fmt --check"]

[tasks.doc]
description = "rustdoc with warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --features bench,mock"

[tasks.miri]
description = "Miri over the pure-memory unit tests: UB, aliasing, uninit reads"
run = '''
set -eu
toolchain=${DIOS_NIGHTLY:-nightly}
rustup component add --toolchain "$toolchain" miri >/dev/null 2>&1 || {
  echo "install the miri component: rustup component add --toolchain $toolchain miri" >&2
  exit 1
}
exec cargo "+$toolchain" miri test --lib --features mock
'''

[tasks.asan]
description = "AddressSanitizer over the syscall-touching integration tests"
run = '''
set -eu
toolchain=${DIOS_NIGHTLY:-nightly}
target=$(rustc "+$toolchain" -vV | sed -n 's/^host: //p')
[ -n "$target" ] || { echo "could not resolve the host target triple" >&2; exit 1; }
# Excluded suites that shell out to cargo or mise re-resolve the pinned stable
# toolchain, which rejects -Z. mmap_workload_contract and workload_suite_contract
# run benchmark modules in-process. Both, along with drp009_gate_contract, require
# bench; this syscall suite enables only mock. arena_registration drives
# real setrlimit(RLIMIT_MEMLOCK) and asserts mlock is refused at the floor, which
# the sanitizer's own mappings move. Everything else is in by default.
orchestration="drp001_plan drp005_probe_gate drp009_gate_contract guard_compile_fail
  mmap_workload_contract pinned_frame_retention_plan public_api r7_source_manifest
  workload_suite_contract arena_registration"
selected=""
for source in tests/*.rs; do
  name=$(basename "$source" .rs)
  case " $(echo $orchestration) " in *" $name "*) continue ;; esac
  selected="$selected --test $name"
done
[ -n "$selected" ] || { echo "no integration suites selected for asan" >&2; exit 1; }
# An explicit target keeps the instrumentation off build scripts and proc macros.
export CARGO_BUILD_TARGET="$target"
export RUSTFLAGS="-Zsanitizer=address"
exec cargo "+$toolchain" test --features mock $selected
'''

[tasks.check]
depends = ["lint", "test", "doc"]

[tasks.docker]
description = "Run a command in the arm64 Linux container (interim functional gate while the bench host is down; io_uring needs seccomp=unconfined; target volume is ext4 so O_DIRECT works — perf gates stay on the bench host)"
usage = 'arg "<command>"'
run = """
docker run --rm --security-opt seccomp=unconfined \
  -v "$PWD":/src:ro \
  -v dios-cargo-registry:/cargo -v dios-target-linux:/target \
  -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target \
  -e DIOS_CONTAINER_COMMAND="$usage_command" \
  -w /src rust:1.96.0-slim-trixie \
  bash -c 'rustup component add clippy rustfmt >/dev/null 2>&1; set -o pipefail; eval "$DIOS_CONTAINER_COMMAND"'
"""

[tasks.bench]
description = "Criterion micro-benches + paired gate benches"
depends = ["bench-host-guard"]
run = "cargo bench --features bench"

[tasks.bench-workloads-smoke]
description = "Validate all seven workload contracts on the shipping backend"
run = "cargo bench --features bench --bench workload_suite -- smoke"

[tasks.bench-host-guard]
description = "Require the active NixOS bench profile before benchmark timing"
run = '''
set -eu
if [ ! -e /etc/NIXOS ]; then
  exit 0
fi
if [ ! -x /etc/bench-profile ]; then
  echo "missing /etc/bench-profile; install the NixOS bench specialisation" >&2
  exit 1
fi
profile_status=$(/etc/bench-profile status)
printf '%s\n' "$profile_status"
printf '%s\n' "$profile_status" | grep -Fxq 'bench_profile=active' || {
  echo "activate benchmark mode with: ssh -t nix sudo /etc/bench-profile enter" >&2
  exit 1
}
mise_executable=${MISE_EXE:-mise}
mise_version=$("$mise_executable" --version)
case "$mise_version" in
  '2026.8.0 '*) ;;
  *)
    echo "benchmark timing requires mise 2026.8.0; found: $mise_version" >&2
    exit 1
    ;;
esac
'''

[tasks.gate]
description = "Assert a bench plan threshold against a paired samples CSV"
run = "cargo bench --features bench --bench compare --"

[tasks.validate-pfr-pairs]
description = "Validate PFR rich process rows and prepare paired gate samples"
usage = '''
arg "<lane>"
arg "<process_csv>"
arg "<paired_csv>"
arg "<provenance_json>"
'''
run = 'cargo bench --features bench --bench pinned_frame_retention -- validate-pairs "$usage_lane" "$usage_process_csv" "$usage_paired_csv" "$usage_provenance_json"'

[tasks.refusal-gate]
description = "Assert the PFR same-frame promotion refusal-rate threshold"
usage = '''
arg "<process_csv>"
arg "<threshold>"
arg "<resamples>"
'''
run = 'cargo bench --features bench --bench pinned_frame_retention -- refusal-gate "$usage_process_csv" "$usage_threshold" "$usage_resamples"'

[tasks.generate-drp-g1-probes]
description = "Generate the frozen DRP-G1 calibration and holdout matrix"
usage = 'arg "<csv>"'
run = 'cargo run --quiet --features bench --bin drp_g1_probes -- generate "$usage_csv"'

[tasks.validate-drp-g1-probes]
description = "Validate the complete frozen DRP-G1 probe-quality artifact"
usage = '''
flag "--structure-only"
arg "<csv>"
'''
run = 'cargo run --quiet --features bench --bin drp_g1_probes -- validate ${usage_structure_only:+--structure-only} "$usage_csv"'

[tasks.prepare-gate-pairs]
description = "Validate rich process rows and prepare paired gate samples"
usage = '''
arg "<process_csv>"
arg "<paired_csv>"
arg "<provenance_json>"
'''
run = 'cargo run --quiet --features bench --bin drp_gate_artifacts -- prepare "$usage_process_csv" "$usage_paired_csv" "$usage_provenance_json"'

[tasks.validate-drp-g2-zero-alloc]
description = "Require zero post-warmup allocations in a complete DRP-G2 artifact"
usage = 'arg "<process_csv>"'
run = 'cargo run --quiet --features bench --bin drp_gate_artifacts -- validate-g2-zero-alloc "$usage_process_csv"'

[tasks.prepare-drp-product-harness]
description = "Prepare the identical DRP009 runner outside a clean product worktree"
usage = '''
arg "<product_worktree>"
arg "<harness_dir>"
'''
run = 'cargo run --quiet --features bench --bin drp_product_harness -- "$usage_product_worktree" "$usage_harness_dir"'
