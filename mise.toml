[tools]
rust = { version = "1.96.0", profile = "default" }   # pinned; default profile ships clippy+rustfmt (mise's rustup default is minimal)
hk = { version = "1.47.0", postinstall = "hk install --mise", depends = ["pkl"] }
pkl = "0.31.0"
actionlint = "1.7.12"

[tasks.build]
run = "cargo build"

[tasks.test]
run = "cargo test --features bench,mock"

[tasks.fmt]
run = "cargo fmt"

[tasks.lint]
description = "clippy (pedantic, warnings as errors) + rustfmt check"
run = ["cargo clippy --all-targets --features bench,mock -- -D warnings", "cargo fmt --check"]

[tasks.doc]
description = "rustdoc with warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --features bench,mock"

[tasks.check]
depends = ["lint", "test", "doc"]

[tasks.docker]
description = "Run a command in the arm64 Linux container (interim functional gate while the bench host is down; io_uring needs seccomp=unconfined; target volume is ext4 so O_DIRECT works — perf gates stay on the bench host)"
usage = 'arg "<command>"'
run = """
docker run --rm --security-opt seccomp=unconfined \
  -v "$PWD":/src:ro \
  -v dios-cargo-registry:/cargo -v dios-target-linux:/target \
  -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target \
  -e DIOS_CONTAINER_COMMAND="$usage_command" \
  -w /src rust:1.96.0-slim-trixie \
  bash -c 'rustup component add clippy rustfmt >/dev/null 2>&1; set -o pipefail; eval "$DIOS_CONTAINER_COMMAND"'
"""

[tasks.bench]
description = "Criterion micro-benches + paired gate benches"
run = "cargo bench --features bench"

[tasks.gate]
description = "Assert a bench plan threshold against a paired samples CSV"
run = "cargo bench --features bench --bench compare --"
