[package]
name = "dios"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
build = "build.rs"
description = "Completion-based async direct-IO driver and userspace frame pool"
license = "MIT"
publish = false

[features]
bench = ["dep:serde_json", "dep:sha2"]
mock = []

[dependencies]
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[test]]
name = "drp009_gate_contract"
required-features = ["bench"]

[[test]]
name = "driver"
required-features = ["mock"]

[[test]]
name = "faults"
required-features = ["mock"]

[[test]]
name = "miss"
required-features = ["mock"]

[[example]]
name = "api_fit_spike"
required-features = ["mock"]

[[example]]
name = "gateway_contract"
required-features = ["mock"]

[[bench]]
name = "smoke"
harness = false

[[bench]]
name = "paired_smoke"
harness = false
required-features = ["bench"]

[[bench]]
name = "compare"
harness = false
required-features = ["bench"]

[[bench]]
name = "read_path_product"
harness = false
required-features = ["bench"]

[[bench]]
name = "overlap"
harness = false
required-features = ["bench", "mock"]

[[bench]]
name = "miss_table_pending_index"
harness = false
required-features = ["bench", "mock"]

[[bench]]
name = "mmap_warm_path"
harness = false
required-features = ["bench", "mock"]

[[bench]]
name = "mmap_tlb_pressure"
harness = false
required-features = ["bench", "mock"]

[[bench]]
name = "pinned_frame_retention"
harness = false
required-features = ["bench"]

[[bench]]
name = "ring_read_bracket"
harness = false
required-features = ["bench"]

[[bench]]
name = "arena_registration"
harness = false
required-features = ["bench"]

[[bench]]
name = "prefetch_window"
harness = false
required-features = ["bench"]

[[bench]]
name = "arena_population"
harness = false
required-features = ["bench"]

[[bin]]
name = "drp_g1_probes"
path = "src/bin/drp_g1_probes.rs"
required-features = ["bench"]

[[bin]]
name = "drp_gate_artifacts"
path = "src/bin/drp_gate_artifacts.rs"
required-features = ["bench"]

[[bin]]
name = "drp_product_harness"
path = "src/bin/drp_product_harness.rs"
required-features = ["bench"]

[lints.rust]
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
